name: Instant Deploy - WhatsApp Bot

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - '.gitignore'
  workflow_dispatch:
  schedule:
    # Auto-restart every 5 hours to stay within GitHub Actions limits and run 24/7
    - cron: '0 */5 * * *'

# Ensure only one instance of the bot runs at a time to prevent WhatsApp session conflicts
concurrency:
  group: whatsapp-bot
  cancel-in-progress: true

jobs:
  deploy-and-run:
    name: Run WhatsApp Bot
    runs-on: ubuntu-latest
    timeout-minutes: 360

    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Node.js dependencies
        run: |
          npm install

      - name: Start WhatsApp Bot
        id: bot
        run: |
          echo "Starting WhatsApp Bot..."
          # Run for up to ~5 hours (300m) to allow clean session saving before GitHub's 6h hard limit
          timeout 300m node bot.js || true

      - name: Sync and save session auth state
        if: always()
        run: |
          echo "Saving WhatsApp session data..."
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add auth/ session.txt 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git pull --rebase origin main || true
            git commit -m "chore: sync session auth state [skip ci]"
            git push origin main || true
            echo "Session state pushed successfully."
          else
            echo "No session changes to sync."
          fi

      - name: Trigger next cycle
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Queuing next workflow cycle..."
          gh workflow run deploy.yml --ref main || echo "Scheduled cron will trigger next run automatically."
